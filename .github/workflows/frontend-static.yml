name: Frontend Static Build

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-static.yml"
      - "frontend/**"
  push:
    branches:
      - main
      - production
    paths:
      - ".github/workflows/frontend-static.yml"
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    name: Build static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.2.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm run test:derivations

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: https://accountpilot-backend.onrender.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          NEXT_PUBLIC_ENABLE_DEV_LOGIN: "false"
        run: pnpm run build

      - name: Verify static export
        shell: bash
        run: |
          test -f out/index.html
          test -f out/404.html
